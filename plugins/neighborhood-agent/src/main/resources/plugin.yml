name: NeighborhoodAgent
version: ${version}
main: com.neighborhood.agent.NeighborhoodAgentPlugin
api-version: '1.21'
description: Local-first in-game Minecraft sidekick
author: neighborhood-server
depend: [FastAsyncWorldEdit]
softdepend: [GriefPrevention]
commands:
  agent:
    description: Ask your Minecraft sidekick for help
    usage: /agent <what you want>
    permission: neighborhood.agent
  agent-as:
    description: Console/RCON live-validation hook that runs a sidekick job as a player
    usage: /agent-as <player> <prompt...>
    permission: neighborhood.agent.eval
permissions:
  neighborhood.agent.eval:
    description: Run agent-as live validation from console/RCON
    default: op
  neighborhood.agent:
    description: Use /agent
    default: true
  neighborhood.agent.world:
    description: Let the sidekick change time and weather
    default: true
  neighborhood.agent.inventory:
    description: Let the sidekick give the player items
    default: true
  neighborhood.agent.mobs:
    description: Let the sidekick summon bounded friendly mobs
    default: true
  neighborhood.agent.undo:
    description: Undo the player's most recent sidekick action
    default: true
  neighborhood.agent.build:
    description: Let the sidekick build and paste curated templates where the player may edit
    default: true

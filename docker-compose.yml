services:
  mc:
    image: itzg/minecraft-server:java25
    container_name: mc-lan
    pull_policy: daily
    init: true
    tty: true
    stdin_open: true
    restart: unless-stopped
    stop_grace_period: 2m
    mem_limit: 10g

    ports:
      - '25565:25565/tcp'
      - '19132:19132/udp'
      # BlueMap web UI — LAN-reachable. Open http://<this-machine-ip>:8100
      # from any device on the home network. To lock back to this machine
      # only, change the left side to '127.0.0.1:8100'. To share publicly,
      # add a third playit TCP tunnel pointing at 127.0.0.1:8100.
      - '0.0.0.0:8100:8100/tcp'

    environment:
      EULA: 'TRUE'
      TYPE: PAPER
      # Temporary play-only bump for 26.3 biomes/content. Paper 26.3 is still
      # BETA; FAWE + /agent are parked until a 26.3 FAWE adapter ships.
      # New Wilderness Bound biomes only appear in newly generated chunks —
      # set MC_LEVEL to a fresh world name in .env if you want them everywhere.
      # Omit PAPER_BUILD to auto-fetch the newest Paper build for VERSION on start.
      VERSION: '26.3'
      PAPER_CHANNEL: experimental

      INIT_MEMORY: 2G
      MAX_MEMORY: 8G
      # MeowIce/Aikar flags target G1; on aarch64 + Java 25 they hit JDK-8359378
      # (HotSpot late G1 barrier expansion crash). Generational ZGC sidesteps
      # that entire code path, gives sub-ms pauses, and is well-suited to
      # Minecraft. Flip USE_MEOWICE_FLAGS back on once Temurin ships a fix.
      USE_MEOWICE_FLAGS: 'false'
      JVM_XX_OPTS: >-
        -XX:+UseZGC
        -XX:+AlwaysPreTouch
        -XX:+ParallelRefProcEnabled
        -XX:+DisableExplicitGC
        -XX:+PerfDisableSharedMem

      # NOTE: CoreProtect is intentionally absent. Its free Community Edition
      # lags one Minecraft version on purpose and hard-gates internally — the
      # latest public build (23.2) self-disables on 26.1.2 with "Minecraft
      # 26.1.2 is not supported", and Modrinth has no 26.1.2-tagged file, so
      # listing it anywhere either fails the mc container or loads a dead jar.
      # Re-add it (MODRINTH_PROJECTS, or a direct CDN jar URL here) once a
      # 26.1.x-compatible CoreProtect build is published.
      # Geyser stable still targets Java 26.2 and crashes on Paper 26.3
      # (CraftItemStack asBukkitCopy). Use the official 26.3 preview channel
      # from GeyserMC/Geyser#6712 until that lands in versions/latest.
      PLUGINS: |
        https://download.geysermc.org/v2/projects/geyserpreview/versions/pr.6712/builds/latest/downloads/spigot
        https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/spigot

      # Modrinth-managed plugins (auto-update on container restart).
      # ViaVersion + ViaBackwards: Geyser still emulates a Java 26.2 client, so
      # ViaBackwards lets that client join this 26.3 server (Bedrock crossplay).
      # BlueMap / GriefPrevention ship 26.3 builds. FAWE is omitted — no 26.3
      # release yet; without it NeighborhoodAgent will not load (intentional).
      # (CoreProtect still unavailable — see the PLUGINS note above.)
      MODRINTH_PROJECTS: |
        viaversion
        viabackwards
        bluemap
        griefprevention

      # Mojang session auth. Set MC_ONLINE_MODE=false in .env for offline/LAN
      # play during auth outages (UUIDs/ops can drift — flip back after).
      ONLINE_MODE: ${MC_ONLINE_MODE:-TRUE}
      ENFORCE_SECURE_PROFILE: 'false'
      MAX_PLAYERS: '10'
      VIEW_DISTANCE: '12'
      SIMULATION_DISTANCE: '6'
      PAUSE_WHEN_EMPTY_SECONDS: '600'

      # Server browser banner. Use § color codes (vanilla format).
      MOTD: ${MC_MOTD:-§aThe Neighborhood §7§o- §r§fCreative crossplay (Java + Bedrock)}

      MODE: creative
      FORCE_GAMEMODE: 'true'
      ALLOW_FLIGHT: 'true'
      OP_PERMISSION_LEVEL: '4'
      SPAWN_PROTECTION: '0'

      # --- Neighborhood world ---
      # Default party world is vanilla terrain. Override LEVEL/LEVEL_TYPE in
      # .env when temporarily booting sandbox/test worlds.
      LEVEL: ${MC_LEVEL:-world}
      LEVEL_TYPE: ${MC_LEVEL_TYPE:-minecraft:normal}

      ENABLE_AUTOPAUSE: 'false'
      ENABLE_RCON: 'true'
      RCON_PASSWORD_FILE: /run/secrets/rcon_pass
      AGENT_API_TOKEN: ${AGENT_API_TOKEN:?Set AGENT_API_TOKEN in .env — run make bootstrap}

      # Apply server config patches every boot. Currently disables Paper's
      # connection-throttle so Geyser/Floodgate Bedrock players sharing the
      # same source IP, and playit-routed Java players sharing one gateway,
      # don't get "Connection throttled!" on rapid reconnect. See
      # config/patches/bukkit-overrides.json for the full rationale.
      PATCH_DEFINITIONS: /patches

      # Suppress RCON/console command echoes to ops chat. The agent shells
      # out RCON for every tool call (build, teleport, give, summon, etc.);
      # without this, ops see a torrent of [Rcon: ...] lines while the agent
      # works. Errors still surface in the server console / agent audit log.
      BROADCAST_RCON_TO_OPS: 'false'
      BROADCAST_CONSOLE_TO_OPS: 'false'

      STOP_SERVER_ANNOUNCE_DELAY: '20'
      STOP_DURATION: '90'

      # Friends-server override: MC_ENFORCE_WHITELIST=false in .env
      ENFORCE_WHITELIST: ${MC_ENFORCE_WHITELIST:-true}
      EXISTING_WHITELIST_FILE: SYNCHRONIZE
      EXISTING_OPS_FILE: MERGE

      # Pre-opped players. MERGE mode keeps anyone you `/op` at runtime, and
      # also re-ops anyone listed here on every restart. Bedrock players show
      # up with a leading "." (Floodgate prefix) - keep it when adding them.
      # OPS: |
      #   JavaPlayer
      #   .BedrockPlayer
      # WHITELIST: |
      #   friend1
      #   friend2

    volumes:
      - ./data:/data
      # itzg PATCH_DEFINITIONS — applied on every boot (see above)
      - ./config/patches:/patches:ro
      # BlueMap config (only the keys we care about — accept-download, the
      # webserver bind, render-thread cap). BlueMap fills in defaults for
      # everything else on first boot and writes per-world configs into
      # data/plugins/BlueMap/maps/ as usual. File-level binds so BlueMap
      # can still write its own state in the same directory.
      - ./config/bluemap/core.conf:/data/plugins/BlueMap/core.conf
      - ./config/bluemap/webserver.conf:/data/plugins/BlueMap/webserver.conf

    extra_hosts:
      - host.docker.internal:host-gateway

    secrets:
      - rcon_pass

    healthcheck:
      test: mc-health
      start_period: 3m
      interval: 15s
      retries: 10

  # Parked while the Paper world runs 26.3 without FAWE. Bring back with
  # `docker compose --profile agent up -d` once FAWE ships a 26.3 build.
  mc-agent:
    profiles: ['agent']
    build:
      context: .
      dockerfile: companion/Dockerfile
    container_name: mc-agent
    restart: unless-stopped
    # litematic → schem conversion is memory-heavy (multi‑M block builds).
    mem_limit: 6g
    depends_on:
      mc:
        condition: service_healthy
    environment:
      AGENT_API_TOKEN: ${AGENT_API_TOKEN:?Set AGENT_API_TOKEN in .env — run make bootstrap}
      # Binds all interfaces inside the container; safe — no host ports: mapping.
      AGENT_BIND_HOST: 0.0.0.0
      AGENT_BIND_PORT: '8787'
      # Named volume (not virtiofs bind) — SQLite WAL under ./data hit disk I/O
      # errors under live-eval load on Docker Desktop macOS.
      COMPANION_DB_PATH: /var/lib/companion/companion.sqlite3
      COMPANION_JOB_DEADLINE_MS: '10000'
      AGENT_LOCAL_MODEL_TIMEOUT_SEC: '5'
      # Eval mode runs deterministic scripted scenarios; bigger reasoning
      # models (qwen3:8b with think:false) need >15s on cold tool-schema
      # load. In-game flow is unaffected.
      AGENT_EVAL_LOCAL_MODEL_TIMEOUT_SEC: '120'
      # Greenfield companion compiler (host Ollama / Apple MLX).
      LOCAL_LLM_BASE_URL: ${LOCAL_LLM_BASE_URL:-http://host.docker.internal:11434}
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-gemma4:12b-mlx}
      LOCAL_LLM_NUM_CTX: ${LOCAL_LLM_NUM_CTX:-2048}
      LOCAL_LLM_NUM_PREDICT: ${LOCAL_LLM_NUM_PREDICT:-192}
      LOCAL_LLM_KEEP_ALIVE: ${LOCAL_LLM_KEEP_ALIVE:-30m}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma4:12b-mlx}
      TEMPLATE_RANKER_MODE: ${TEMPLATE_RANKER_MODE:-hybrid}
      TEMPLATE_EMBEDDING_BACKEND: ${TEMPLATE_EMBEDDING_BACKEND:-local}
      TEMPLATE_RANK_TOP_K: ${TEMPLATE_RANK_TOP_K:-8}
      TEMPLATE_CONFIDENCE_HIGH: ${TEMPLATE_CONFIDENCE_HIGH:-0.72}
      TEMPLATE_CONFIDENCE_MEDIUM: ${TEMPLATE_CONFIDENCE_MEDIUM:-0.45}
      TEMPLATE_RANK_MARGIN: ${TEMPLATE_RANK_MARGIN:-0.12}
      TEMPLATE_RANK_W_LEX: ${TEMPLATE_RANK_W_LEX:-0.55}
      TEMPLATE_RANK_W_SEM: ${TEMPLATE_RANK_W_SEM:-0.30}
      TEMPLATE_RANK_W_POL: ${TEMPLATE_RANK_W_POL:-0.15}
      TEMPLATE_RANKING_AUDIT: ${TEMPLATE_RANKING_AUDIT:-true}
      # Flat-world preset stacks from min build height (-64), so the surface
      # sits at y=-60. Seed pipeline + sandbox tools need that.
      AGENT_SEED_SANDBOX_X: ${AGENT_SEED_SANDBOX_X:-9500}
      AGENT_SEED_SANDBOX_Y: ${AGENT_SEED_SANDBOX_Y:--60}
      AGENT_SEED_SANDBOX_Z: ${AGENT_SEED_SANDBOX_Z:-9500}
      # Ops `/ai ingest` writes through these bind mounts.
      AGENT_CATALOG_PATH: /app/assets/catalog.json
      AGENT_SCHEM_DIR: /app/assets/schematics
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - companion-db:/var/lib/companion
      # Writable for ops `/ai ingest` (shared companion.ingest_schem) + catalog reload.
      - ./agent/templates/catalog.json:/app/assets/catalog.json
      - ./agent/templates/schematics:/app/assets/schematics
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=2).read()",
        ]
      start_period: 20s
      interval: 15s
      timeout: 5s
      retries: 5

  playit:
    image: ghcr.io/playit-cloud/playit-agent:latest
    container_name: playit-agent
    pull_policy: daily
    network_mode: host
    restart: unless-stopped
    environment:
      SECRET_KEY: ${PLAYIT_SECRET_KEY}
    depends_on:
      mc:
        condition: service_healthy

  backup:
    image: itzg/mc-backup
    container_name: mc-backup
    restart: unless-stopped
    depends_on:
      mc:
        condition: service_healthy
    environment:
      BACKUP_INTERVAL: 2h
      PRUNE_BACKUPS_DAYS: '14'
      INITIAL_DELAY: '0'
      RCON_HOST: mc
      RCON_PASSWORD_FILE: /run/secrets/rcon_pass
      # Skip dev/eval sandbox dirs so backups stay focused on world state.
      EXCLUDES: '*.jar,cache,logs,*.tmp,_reset_archives,corpus-runs,eval-runs'
    volumes:
      - ./data:/data:ro
      - ./backups:/backups
    secrets:
      - rcon_pass

  # Opt-in bundled Ollama (Linux/Windows, or when you skip host install).
  # Mac Apple Silicon: prefer host Ollama for Metal GPU — do not enable this profile.
  ollama:
    image: ollama/ollama:latest
    container_name: mc-ollama
    profiles: ['ollama']
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ['CMD', 'ollama', 'list']
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  ollama-pull:
    image: ollama/ollama:latest
    container_name: mc-ollama-pull
    profiles: ['ollama']
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ['/bin/sh', '-ec']
    command:
      - ollama pull ${OLLAMA_MODEL:-gemma4:12b-mlx}
    environment:
      OLLAMA_HOST: http://ollama:11434
    restart: 'no'

secrets:
  rcon_pass:
    file: ./secrets/rcon_password

volumes:
  ollama-models:
  companion-db:

cases:
- id: shape.platform.direct.001
  category: shape
  intent: build_platform
  language_style: direct
  prompt: Build a 5 by 5 quartz platform at my feet
  expect:
    status: done
    max_steps: 14
    tool_any: &id001
    - name: build_platform
    world_probe: &id002
      kind: shape_built
      shape: platform
      block: quartz_block
      width: 5
      platform_depth: 5
  tags: []

cases:
- id: castle.castle_small_keep.direct.001
  category: castle
  intent: build_castle_small_keep
  language_style: direct
  prompt: Build a castle in front of me
  expect:
    status: done
    max_steps: 14
    tool_any:
    - name: paste_template_at_player
      arguments_any:
      - template_id: castle_small_keep
      - template_id: castle small keep
    - name: build_house_at_player
    - name: build_castle_at_player
    - name: build_animal_pen_at_player
    world_probe:
      kind: template_built
      anchor: player_forward
      template_id: castle_small_keep
      sample_blocks:
      - stone_bricks
      - cobblestone
      min_matches: 2
  tags: []

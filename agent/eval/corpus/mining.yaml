cases:
- id: mining.shaft.direct.001
  category: mining
  intent: mine_shaft
  language_style: direct
  prompt: Dig a shaft 16 blocks below me
  expect:
    tool_any:
    - name: mine_shaft_at_player
      arguments_any:
      - depth: 16
      - depth: 16
        forward_offset: 0
    world_probe:
      kind: shaft_dug
      shaft_depth: 16
  tags: []

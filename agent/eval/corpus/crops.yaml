cases:
- id: crop.wheat_farm_small.direct.001
  category: crop
  intent: build_wheat_farm_small
  language_style: direct
  prompt: field of wheat
  expect:
    status: done
    max_steps: 14
    tool_any:
    - name: paste_template_at_player
      arguments_any:
      - template_id: wheat_farm_small
      - template_id: wheat farm small
    - name: build_house_at_player
    - name: build_castle_at_player
    - name: build_animal_pen_at_player
    world_probe:
      kind: template_built
      anchor: player_forward
      template_id: wheat_farm_small
      sample_blocks:
      - farmland
      - dirt
      - wheat
      min_matches: 2
  tags: []

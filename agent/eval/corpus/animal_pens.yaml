cases:
- id: pen.chicken_coop_small.direct.001
  category: animal_pen
  intent: build_chicken_coop_small
  language_style: direct
  prompt: make me a chicken pen
  expect:
    tool_any:
    - name: paste_template_at_player
      arguments_any:
      - template_id: chicken_coop_small
      - template_id: chicken pen
    - name: build_animal_pen_at_player
      arguments_any:
      - animal: chicken
    world_probe:
      kind: structural_check
      check: min_palette_coverage
      block: oak_fence
      min_count: 8
      bbox_width: 14
      bbox_height: 8
      bbox_depth: 14

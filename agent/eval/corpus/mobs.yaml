cases:
- id: mob.chicken.direct.001
  category: mob
  intent: summon_chicken
  language_style: direct
  prompt: Spawn 4 chickens here
  expect:
    tool_any:
    - name: summon_entity
      arguments_any:
      - entity: chicken
      - entity: chicken
        count: 4
    - name: paste_template_at_player
    - name: build_animal_pen_at_player
    world_probe:
      kind: mob_count
      entity: chicken
      count_min: 1
      search_radius: 16
  tags: []

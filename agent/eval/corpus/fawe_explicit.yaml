cases:
- id: fawe.sphere.direct.001
  category: fawe
  intent: fawe_sphere
  language_style: direct
  prompt: Use FAWE to make a small glass sphere at my location
  expect:
    tool_any:
    - name: fawe_sphere_at_player
    - name: fawe_as_player
    - name: build_sphere
    world_probe:
      kind: shape_built
      shape: sphere
      block: glass
      radius: 5
      min_matches: 1
  tags: []

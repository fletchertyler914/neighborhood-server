cases:
- id: decor.fountain_small.direct.001
  category: decoration
  intent: build_fountain_small
  language_style: direct
  prompt: Place a fountain
  expect:
    status: done
    max_steps: 14
    tool_any:
    - name: paste_template_at_player
      arguments_any:
      - template_id: fountain_small
      - template_id: fountain small
    - name: build_house_at_player
    - name: build_castle_at_player
    - name: build_animal_pen_at_player
    world_probe:
      kind: template_built
      anchor: player_forward
      template_id: fountain_small
      sample_blocks:
      - oak_planks
      - stone_bricks
      - cobblestone
      - oak_log
      min_matches: 2
  tags: []

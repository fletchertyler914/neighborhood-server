    enabled: true
    notes: "Drop packs under agent/templates/packs/<name>/ with pack.json; run ingest --ingest-packs"
    category_map: {}
    complexity_map:
      default: common

  - source_id: neighborhood_internal
    display_name: Neighborhood Internal Gold Corpus
    source_type: internal
    source_url: https://github.com/neighborhood-server/templates

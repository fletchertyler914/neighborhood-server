    license_spdx: CC-BY-4.0
    license_url: https://creativecommons.org/licenses/by/4.0/
    allowed_for_ingest: true
    attribution_required: true
    attribution_template: "Neighborhood Minecraft Server template pack (CC-BY-4.0)"
    format: schem
    enabled: true
    category_map: {}
    complexity_map:
      default: basic

name: eval-live-tools

on:
  workflow_dispatch:
  schedule:
    - cron: "37 8 * * *"

jobs:
  live_tools:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pydantic pyyaml
      - name: Run deterministic live tool integration tests
        env:
          AGENT_LIVE_TOOL_PLAYER: ${{ vars.AGENT_LIVE_TOOL_PLAYER }}
        run: |
          ./scripts/live-tool-tests.sh

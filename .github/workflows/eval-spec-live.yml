name: eval-spec-live

on:
  workflow_dispatch:
  schedule:
    - cron: "7 9 * * *"

jobs:
  eval_spec_live:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi uvicorn httpx pydantic pyyaml pytest
      - name: Wait for mc-agent
        run: |
          for i in $(seq 1 60); do
            if docker exec mc-agent python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=2).read()" 2>/dev/null; then
              echo "mc-agent ready"
              exit 0
            fi
            sleep 2
          done
          echo "mc-agent not ready"
          exit 1
      - name: Live spec eval with strict baseline
        env:
          AGENT_EVAL_MODE: "1"
          AGENT_EVAL_DISABLE_RETRIEVAL: "1"
          AGENT_EVAL_DISABLE_DYNAMIC_CONTEXT: "1"
          AGENT_EVAL_FAIL_ON_DRIFT: "1"
          AGENT_EVAL_CLIENT_TIMEOUT_SEC: "240"
          AGENT_API_TOKEN: ${{ secrets.AGENT_API_TOKEN }}
          EVAL_COMPARE_BASELINE: agent/eval/baseline.strict.json
        run: |
          docker exec \
            -e AGENT_EVAL_DISABLE_RETRIEVAL=1 \
            -e AGENT_EVAL_DISABLE_DYNAMIC_CONTEXT=1 \
            -e AGENT_EVAL_FAIL_ON_DRIFT=1 \
            -e AGENT_EVAL_CLIENT_TIMEOUT_SEC=240 \
            -e AGENT_API_TOKEN="${AGENT_API_TOKEN}" \
            mc-agent python -m agent.eval.cli spec \
              --repo-root /app \
              --orchestrator-url http://127.0.0.1:8787 \
              --compare-baseline /app/agent/eval/baseline.strict.json \
              --json-out /app/data/eval-runs/ci-spec-live

##                          ##
##      BlueMap Core         ##
##                           ##
# Pre-staged config from this repo. BlueMap merges missing keys with its
# defaults on first boot; we only set the must-have flags here.

# BlueMap fetches Minecraft textures + a small webapp bundle from Mojang's
# CDN on first run. Without this opt-in, the plugin refuses to start and
# prints a message saying you need to flip it. We flip it here so the
# stack works on first boot without manual intervention.
accept-download: true

# Cap render-thread parallelism. Defaults to ~half of available cores;
# pin to 2 to keep BlueMap from monopolizing the CPU during big renders
# (this is a friends server, not a render farm).
render-thread-count: 2

# Disable BlueMap's anonymous metrics ping — Modrinth's MODRINTH_PROJECTS
# pipeline already tells us what version is installed.
metrics: false

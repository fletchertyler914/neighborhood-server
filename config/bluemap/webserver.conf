# Pre-staged config from this repo.
#
# We bind 0.0.0.0 *inside* the container so Docker can forward the port.
# The actual host-side lockdown to localhost-only lives in
# docker-compose.yml:
#     ports:
#       - '127.0.0.1:8100:8100/tcp'
# That keeps http://127.0.0.1:8100 reachable only from this machine.
# To share on LAN: change the host side to '0.0.0.0:8100'.
# To share publicly: add a TCP playit tunnel to 127.0.0.1:8100.

enabled: true
ip: "0.0.0.0"
port: 8100
